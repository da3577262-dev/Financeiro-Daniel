<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>finanças</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{--nav:#0B2239;--mint:#4ED08F;--bg:#E9EEF3;--tx:#1f2d3d;--mut:#6b7a8c;--bd:#dfe6ee;--card:#fff;--line:#eef2f6;--soft:#f7f9fb;--red:#EF4444;--bl:#3B82F6;--am:#F59E0B;--pu:#8B5CF6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[data-theme=dark]{--bg:#0F172A;--card:#1E293B;--tx:#E2E8F0;--mut:#94A3B8;--bd:#334155;--line:#2B3A50;--soft:#17233A;color-scheme:dark}*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:14px Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
#sb{width:240px;background:var(--nav);color:#fff;flex:none;padding:18px 12px;position:sticky;top:0;height:100vh}
.brand{font-size:20px;font-weight:700;color:var(--mint);text-align:center;padding-bottom:16px;border-bottom:1px solid #1d3652;margin-bottom:12px}
.nv{padding:11px 14px;border-radius:8px;cursor:pointer;color:#c5d3e2;margin-bottom:4px;border-left:3px solid transparent}
.nv.on{background:#13304f;color:var(--mint);border-left-color:var(--mint);font-weight:600}
#mn{flex:1;min-width:0}
.top{background:var(--nav);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.top h1{margin:0;font-size:20px;padding-left:18px;border-left:2px solid var(--mint)}
.top small{display:block;font-size:12px;color:#9fb3c8;font-weight:400;margin-top:2px}
.kp{margin-left:auto;display:flex;gap:26px;flex-wrap:wrap}.kp div{text-align:center;font-size:12px}.kp b{display:block;color:var(--mint);font-size:20px}
#ct{padding:16px 22px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;min-width:0}
.card h4{margin:0 0 10px;font-weight:600;color:var(--mut);font-size:13px}
.cv{height:260px;position:relative}
.big{font-size:24px;font-weight:700;color:var(--tx)}.neg{color:var(--red)}.pos{color:#16a870}
.fl{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
.fl label,.md label{display:block;font-size:12px;color:var(--mut)}
select,input,textarea{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);width:100%;margin-top:3px}
.fl>*{flex:1;min-width:130px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:6px;padding:7px 12px;color:var(--tx)}
.b1{background:var(--mint);border-color:var(--mint);color:#06281a;font-weight:600}.b2{background:var(--card)}.bd{color:var(--red)}
.fl button{flex:none}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:600;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}td input{margin:0;padding:4px 6px;width:110px}
.bg{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;color:#fff;display:inline-block}
.pb{height:8px;background:var(--line);border-radius:5px;overflow:hidden}.pb i{display:block;height:100%;background:var(--mint)}
.ov{position:fixed;inset:0;background:#0b223988;display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.md{background:var(--card);border-radius:12px;padding:18px;width:min(440px,100%);max-height:90vh;overflow:auto}.md h3{margin:0 0 8px}.md label{margin-top:10px}.md input[type=checkbox]{width:auto}
.ba{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#ts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));color:#fff;padding:10px 16px;border-radius:8px;z-index:60;display:none}
.sc button.on{background:var(--nav);color:var(--mint);border-color:var(--nav)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.em{color:var(--mut);text-align:center;padding:30px}
@media(max-width:800px){body{display:block}#sb{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px;padding:10px}.brand{width:100%;border:0;padding:0 0 6px}.nv{padding:7px 10px;margin:0}#ct{padding:12px}.kp{margin-left:0}}
</style></head><body>
<div id="sb"></div>
<div id="mn"><div class="top" id="tp"></div><div id="ct"></div></div>
<div id="ts"></div>
<script>
const M=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const T=['Receita','Despesa Fixa','Despesa Variável','Investimento'],FP=['PIX','Cartão','Dinheiro','Boleto','Transferência'];
const TC={'Receita':'#16a870','Despesa Fixa':'#3B82F6','Despesa Variável':'#F59E0B','Investimento':'#8B5CF6'};
const PAL=['#4ED08F','#3B82F6','#F59E0B','#8B5CF6','#EF4444','#14B8A6','#EC4899','#64748B'];
const NAV=[['📊','Resumo','Visão geral do seu fluxo financeiro'],['💸','Entradas/Saídas','Gerencie seus lançamentos - edite data, valor e categoria'],['🔮','Projeções','Projeções automáticas baseadas nos seus lançamentos'],['🎯','Metas','Defina metas a serem cumpridas com base no seu saldo atual'],['💰','Orçamentos','Defina quantidades máximas a serem gastas com base nos seus lançamentos de saída'],['🏷️','Categorias','Configure suas categorias de entrada e saída'],['📈','Bolsa de valores','Acompanhe suas ações e abra a gaveta de cada cotação'],['🧮','Simulações','Simule quanto suas ações rendem, no passado ou no futuro'],['💼','Meus investimentos','Acompanhe o valor atual, aportes, retiradas e a projeção dos seus investimentos']];
const DEF={E:['Salário','Freelance','Investimentos','Extra'],S:['Moradia','Contas','Transporte','Alimentação','Lazer','Compras','Saúde','Educação','Investimentos','Outros','INSS','NUBANK','SANTANDER','MERCADO PAGO']};
const $=s=>document.querySelector(s),brl=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n||0),fdd=d=>d.split('-').reverse().join('/');
let S={l:[],m:[],o:[],c:[],p:{}},tab=0,CH={},F={q:'',m:'',t:'',c:''},sortD=-1,sc='r',tm,saved='';
try{Object.assign(S,JSON.parse(localStorage.getItem('financas_v10')||'{}'))}catch(e){}
try{S.dk=localStorage.getItem('financas_tema')=='1'}catch(e){}
function save(){if(!(window.syncSave&&window.syncSave()))try{localStorage.setItem('financas_v10',JSON.stringify(S))}catch(e){}saved=new Date().toTimeString().slice(0,5);const e=$('#st');if(e)e.textContent='Salvo às '+saved}
function touch(){const e=$('#st');if(e)e.textContent='Alterações não salvas';clearTimeout(tm);tm=setTimeout(save,500)}
function toast(m,t){const e=$('#ts');e.textContent=m;e.style.background=t=='erro'?'#EF4444':t=='aviso'?'#D97706':'#16a870';e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3000)}
const sum=a=>a.reduce((x,y)=>x+y,0);
function sums(){const r=Array(12).fill(0),d=Array(12).fill(0);S.l.forEach(x=>{(x.tipo=='Receita'?r:d)[x.mes]+=+x.valor});return{r,d,s:r.map((v,i)=>v-d[i])}}
function tot(){const s=sums(),rt=sum(s.r),dt=sum(s.d);return{...s,rt,dt,sd:rt-dt,tx:rt?(rt-dt)/rt*100:0,mr:s.r.filter(v=>v>0).length,md:s.d.filter(v=>v>0).length}}
function cats(){const o={},t=tot();S.l.filter(x=>x.tipo!='Receita').forEach(x=>{const c=o[x.categoria]=o[x.categoria]||{tot:0,fixo:0,m:{}};c.tot+=+x.valor;c.m[x.mes]=(c.m[x.mes]||0)+ +x.valor;if(x.tipo=='Despesa Fixa')c.fixo=1});Object.values(o).forEach(c=>c.avg=t.md?c.tot/t.md:0);return o}
const catCor=n=>(S.c.find(c=>c.n==n)||{}).cor||'#64748B';
const cn=t=>S.c.filter(c=>c.t==t).map(c=>c.n);
function ch(id,type,data,o={}){const e=document.getElementById(id);if(!e)return;CH[id]&&CH[id].destroy();const pie=/pie|doughnut/.test(type),op={responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:data.datasets.length>1||pie,position:'bottom'},tooltip:{callbacks:{label:c=>(c.dataset.label||c.label)+': '+brl(c.raw)}}}};if(!pie)op.scales={y:{grid:{color:Chart.defaults.borderColor},ticks:{callback:v=>'R$ '+v}},x:{grid:{display:false}}};if(o.indexAxis){op.indexAxis=o.indexAxis;op.scales={x:{grid:{color:Chart.defaults.borderColor}},y:{grid:{display:false}}}}CH[id]=new Chart(e,{type,data,options:op})}
const cv=(id,t)=>`<div class="card"><h4>${t}</h4><div class="cv"><canvas id="${id}"></canvas></div></div>`;
function modal(t,f,cb,init){const o=document.createElement('div');o.className='ov';const fld=x=>x.type=='select'?`<select id="f_${x.k}">${x.opts.map(p=>{const[v,l]=Array.isArray(p)?p:[p,p];return`<option value="${v}" ${v==x.v?'selected':''}>${l}</option>`}).join('')}</select>`:x.type=='checkbox'?`<input type=checkbox id="f_${x.k}" ${x.v?'checked':''}>`:x.type=='textarea'?`<textarea id="f_${x.k}">${x.v||''}</textarea>`:`<input id="f_${x.k}" type="${x.type||'text'}" ${x.type=='number'?'step=0.01':''} value="${x.v??''}">`;o.innerHTML=`<div class="md"><h3>${t}</h3>${f.map(x=>`<label>${x.l}${fld(x)}</label>`).join('')}<div class="ba"><button class="b2" id="mc">Cancelar</button><button class="b1" id="ms">Salvar</button></div></div>`;document.body.append(o);o.querySelector('#mc').onclick=()=>o.remove();o.querySelector('#ms').onclick=()=>{const v={};f.forEach(x=>{const e=o.querySelector('#f_'+x.k);v[x.k]=x.type=='checkbox'?e.checked:x.type=='number'?parseFloat(e.value):e.value});if(cb(v)!==false)o.remove()};init&&init(o)}
function head(){const t=tot(),n=NAV[tab];$('#sb').innerHTML=`<div class="brand">💰 finanças</div>`+NAV.map((x,i)=>(i==6?`<div style='color:#9fb3c8;font-size:11px;letter-spacing:.08em;margin:14px 6px 6px'>📈 INVESTIMENTOS</div>`:'')+`<div class='nv ${i==tab?'on':''}' style='${i>5?'margin-left:10px':''}' onclick='tab=${i};render()'>${x[0]} ${x[1]}</div>`).join('');$('#tp').innerHTML=`<h1>${n[1]}<small>${n[2]}</small></h1><div class="kp"><div>Receita<b>${brl(t.rt)}</b></div><div>Despesa<b>${brl(t.dt)}</b></div><div>Saldo<b style="color:${t.sd<0?'#ff8a8a':'var(--mint)'}">${brl(t.sd)}</b></div><div>Economia<b>${t.tx.toFixed(1).replace('.',',')}%</b></div><div style="font-size:11px;color:#9fb3c8">☁️ ${window.nuvem||'Conectando...'}</div><div><button onclick="setTh()">${S.dk?'☀️ Modo claro':'🌙 Modo noturno'}</button></div><div><button class="b1" onclick="save();toast('Dados salvos às '+saved)">💾 SALVAR TUDO</button><span id="st" style="display:block;margin-top:3px;color:#9fb3c8">${saved?'Salvo às '+saved:'Alterações não salvas'}</span></div></div>`}
function render(){head();Object.values(CH).forEach(c=>c.destroy());CH={};$('#ct').innerHTML=[vRes,vLan,vPro,vMet,vOrc,vCat,vBol,vSim,vPf][tab]();[pRes,tbl,pPro,pMet,pOrc,pCat,pBol,pSim,pPf][tab]()}
const emp=()=>S.l.length?'':'<div class="em">Nenhum dado ainda. Adicione seu primeiro lançamento</div>';
function vRes(){const t=tot(),has=S.l.length,bi=has?t.s.indexOf(Math.max(...t.s.filter((v,i)=>t.r[i]||t.d[i]))):-1,wi=has?t.s.indexOf(Math.min(...t.s.filter((v,i)=>t.r[i]||t.d[i]))):-1;
return emp()+`<div class="g"><div class="card"><h4>Melhor Mês</h4><div class="big pos">${bi<0?'—':M[bi]+' · '+brl(t.s[bi])}</div></div><div class="card"><h4>Pior Mês</h4><div class="big ${wi>=0&&t.s[wi]<0?'neg':''}">${wi<0?'—':M[wi]+' · '+brl(t.s[wi])}</div></div></div><div class="g">${cv('c1','Receitas vs Despesas vs Renda')}${cv('c2','Sobra do Mês')}${cv('c3','Saldo Acumulado')}${cv('c4','Gastos por Categoria')}${cv('pf1','Meus investimentos · valor atual')}${cv('pf2','Meus investimentos · projeção')}</div>`}
function pRes(){pfCharts();const t=tot();let a=0;const ac=t.s.map(v=>a+=v),c=cats(),k=Object.keys(c);
ch('c1','line',{labels:M,datasets:[{label:'Receitas',data:t.r,borderColor:'#3B82F6',backgroundColor:'#3B82F6',borderWidth:2},{label:'Despesas',data:t.d,borderColor:'#EF4444',backgroundColor:'#EF4444',borderWidth:2},{label:'Renda',data:t.r,borderColor:'#4ED08F',backgroundColor:'#4ED08F',borderWidth:3,pointRadius:5}]});
ch('c2','bar',{labels:M,datasets:[{label:'Sobra',data:t.s,backgroundColor:t.s.map(v=>v>=0?'#4ED08F':'#EF4444')}]});
ch('c3','line',{labels:M,datasets:[{label:'Saldo acumulado',data:ac,fill:true,borderColor:'#3B82F6',backgroundColor:'#3B82F633'}]});
ch('c4','pie',{labels:k,datasets:[{data:k.map(x=>c[x].tot),backgroundColor:k.map(catCor)}]})}
function filt(){return S.l.filter(x=>(!F.m||x.mes==F.m)&&(!F.t||x.tipo==F.t)&&(!F.c||x.categoria==F.c)&&(!F.q||[x.desc,x.categoria,x.forma].join(' ').toLowerCase().includes(F.q.toLowerCase()))).sort((a,b)=>a.data<b.data?-sortD:sortD)}
function vLan(){const sel=(k,o)=>`<label>${k[1]}<select onchange="F.${k[0]}=this.value;tbl()"><option value="">Todos</option>${o.map(p=>{const[v,l]=Array.isArray(p)?p:[p,p];return`<option value="${v}" ${F[k[0]]==v?'selected':''}>${l}</option>`}).join('')}</select></label>`;
return`<div class="fl"><label>Busca<input placeholder="Descrição, categoria, forma" value="${F.q}" oninput="F.q=this.value;tbl()"></label>${sel(['m','Mês'],M.map((n,i)=>[i,n]))}${sel(['t','Tipo'],T)}${sel(['c','Categoria'],[...new Set(S.l.map(x=>x.categoria))])}</div>
<div class="fl"><button class="b1" onclick="lanM()">+ Novo Lançamento</button><button onclick="imp.click()">📥 Importar Planilha</button><input type=file id=imp accept=.xlsx hidden onchange="impX(this.files[0])"><button onclick="expX()">📤 Exportar Planilha</button><button class="bd" onclick="if(confirm('Limpar tudo?')){S={l:[],m:[],o:[],c:[],p:{},a:S.a,sim:S.sim,fx:S.fx};touch();render()}">🗑️ Limpar Tudo</button></div>
<div class="g"><div class="card"><h4>Total Filtrado</h4><div class="big" id="tf"></div></div><div class="card"><h4>Qtd Lançamentos</h4><div class="big" id="qf"></div></div></div><div class="card"><div class="tw"><table id="tb"></table></div></div>`}
function tbl(){const f=filt();$('#tf').textContent=brl(sum(f.map(x=>x.tipo=='Receita'?+x.valor:-x.valor)));$('#qf').textContent=f.length;
$('#tb').innerHTML=`<tr><th style="cursor:pointer" onclick="sortD*=-1;tbl()">Data ${sortD>0?'↑':'↓'}</th><th>Mês</th><th>Tipo</th><th>Categoria</th><th>Valor</th><th>Descrição</th><th>Forma</th><th>Pago</th><th>Ações</th></tr>`+(f.map(x=>`<tr><td>${fdd(x.data)} <input type=date value="${x.data}" style="width:34px" onchange="chD(${x.id},this.value)"></td><td>${M[x.mes]}</td><td><span class="bg" style="background:${TC[x.tipo]}">${x.tipo}</span></td><td><span class="bg" style="background:${catCor(x.categoria)}">${x.categoria}</span></td><td class="${x.tipo=='Receita'?'pos':'neg'}">${brl(x.valor)}</td><td>${x.desc||''}</td><td>${x.forma}</td><td><input type=checkbox style="width:auto" ${x.pago?'checked':''} onchange="pg(${x.id},this.checked)"></td><td><button onclick="lanM(${x.id})">✏️</button> <button onclick="if(confirm('Excluir lançamento?')){S.l=S.l.filter(y=>y.id!=${x.id});touch();render()}">🗑️</button></td></tr>`).join('')||'<tr><td colspan=9 class="em">Nenhum dado ainda. Adicione seu primeiro lançamento</td></tr>')}
function chD(id,v){if(!v)return;const x=S.l.find(y=>y.id==id);x.data=v;x.mes=+v.slice(5,7)-1;touch();render()}
function pg(id,v){S.l.find(y=>y.id==id).pago=v;touch()}
function lanM(id){const x=S.l.find(y=>y.id==id)||{data:new Date().toISOString().slice(0,10),tipo:'Receita',forma:'PIX',pago:true};x.mes=x.mes??+x.data.slice(5,7)-1;
const co=t=>[...cn(t=='Receita'?'E':'S'),'➕ Nova categoria...'];
modal(id?'Editar Lançamento':'Novo Lançamento',[{k:'data',l:'Data',type:'date',v:x.data},{k:'mes',l:'Mês',type:'select',opts:M.map((n,i)=>[i,n]),v:x.mes},{k:'tipo',l:'Tipo',type:'select',opts:T,v:x.tipo},{k:'categoria',l:'Categoria',type:'select',opts:co(x.tipo),v:x.categoria},{k:'valor',l:'Valor',type:'number',v:x.valor},{k:'desc',l:'Descrição',type:'textarea',v:x.desc},{k:'forma',l:'Forma de Pagamento',type:'select',opts:FP,v:x.forma},{k:'pago',l:'Pago',type:'checkbox',v:x.pago}],v=>{
if(!v.data)return toast('Data obrigatória','erro'),false;if(new Date(v.data)>new Date(Date.now()+365*864e5))return toast('Data muito distante','erro'),false;
if(!(v.valor>0))return toast('Valor deve ser maior que zero','erro'),false;if(!v.categoria||v.categoria.startsWith('➕'))return toast('Categoria obrigatória','erro'),false;v.mes=+v.mes;
if(id)Object.assign(x,v),toast('Lançamento atualizado!');else{S.l.push({id:Date.now(),...v});toast('Lançamento adicionado!')}
touch();if(v.tipo!='Receita'){const o=S.o.find(q=>q.cat==v.categoria),c=cats()[v.categoria];if(o&&c&&c.avg>o.teto)toast('Orçamento '+o.cat+' estourado!','aviso')}render()},o=>{
const g=k=>o.querySelector('#f_'+k);g('data').onchange=e=>{if(e.target.value)g('mes').value=+e.target.value.slice(5,7)-1};
const fill=()=>{g('categoria').innerHTML=co(g('tipo').value).map(c=>`<option>${c}</option>`).join('')};g('tipo').onchange=fill;
g('categoria').onchange=e=>{if(e.target.value.startsWith('➕')){const n=prompt('Nome da nova categoria:');if(n){S.c.push({n,t:g('tipo').value=='Receita'?'E':'S',cor:'#64748B',ic:'🏷️'});fill();g('categoria').value=n}else e.target.selectedIndex=0}}})}
function loadX(cb){if(window.XLSX)return cb();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=cb;document.head.append(s)}
function expX(){loadX(()=>{const w=XLSX.utils.book_new(),t=tot();XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(S.l.map(x=>({Data:x.data,Mês:M[x.mes],Tipo:x.tipo,Categoria:x.categoria,Valor:x.valor,Descrição:x.desc,Forma:x.forma,Pago:x.pago?'Sim':'Não'}))),'Lançamentos');XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(S.m.map(m=>({Meta:m.n,Alvo:m.alvo,Atual:m.atual,Prazo:m.prazo}))),'Metas');XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(M.map((n,i)=>({Mês:n,Receita:t.r[i],Despesa:t.d[i],Sobra:t.s[i]}))),'Resumo');XLSX.writeFile(w,'financas.xlsx')})}

else{const n=Math.max(1,sm.meses|0);lb=Array.from({length:n+1},(_,m)=>m+'m');ser=rows.map(r=>{const g=r.r==null||isNaN(r.r)?rate(r.a):r.r,pp=k=>r.a.price*Math.pow(1+g/100,k/12);return{label:r.t,data:lb.map((_,m)=>{let s=(r.q||0)+nat(r.a,r.v||0)/pp(0);for(let k=1;k<=m;k++)s+=nat(r.a,r.m||0)/pp(k);return toB(r.a,s*pp(m))})}});inv=sum(rows.map(r=>toB(r.a,(r.q||0)*r.a.price)+(r.v||0)+(r.m||0)*n))}
const tot=ser[0].data.map((_,i)=>sum(ser.map(s=>s.data[i])));return{labels:lb,ser,tot,inv,fin:tot[tot.length-1]}}
S.pf=S.pf||[];
const addM=(d,k)=>{const x=new Date(d);x.setUTCMonth(x.getUTCMonth()+k);return x.toISOString().slice(0,10)},dd=(a,b)=>(new Date(b)-new Date(a))/864e5,pfLbl=p=>p.k=='A'?p.ref:'CDB '+p.ref;
function pfVal(p,x,cdi){const mv=p.movs.filter(m=>m.d<=x);if(p.k=='C'){const c=S.cdb.find(y=>y.b==p.ref),pc=p.pct??(c&&c.pct)??0;return Math.max(0,sum(mv.map(m=>{const g=dd(m.d,x),f=Math.pow(1+pc/100*cdi/100,g/365);return m.v+m.v*(f-1)*(1-irC(g))})))}const a=S.a.find(y=>y.t==p.ref);if(!a)return 0;return Math.max(0,toB(a,sum(mv.map(m=>nat(a,m.v)/priceAt(a,m.d)))*priceAt(a,x)))}
function pfData(){const ps=S.pf.filter(p=>p.movs.length);if(!ps.length)return null;const cdi=S.cdi||13.65,T=td(),N=Math.max(1,S.pfN||12),start=ps.flatMap(p=>p.movs.map(m=>m.d)).sort()[0],ds=[];for(let k=0;k<600;k++){const x=addM(start,k);if(x>=T)break;ds.push(x)}ds.push(T);
const hist=ps.map(p=>({label:pfLbl(p),data:ds.map(x=>pfVal(p,x,cdi))})),pl=Array.from({length:N+1},(_,m)=>addM(T,m));
const proj=ps.map(p=>{const cur=pfVal(p,T,cdi),first=p.movs.map(m=>m.d).sort()[0],am=0;let g;if(p.k=='C'){const c=S.cdb.find(y=>y.b==p.ref);g=(p.pct??(c&&c.pct)??0)/100*cdi/100}else{const a=S.a.find(y=>y.t==p.ref);g=a?rate(a)/100:.1}
return{label:pfLbl(p),data:pl.map((_,m)=>{let gr=cur*Math.pow(1+g,m/12);for(let k=1;k<=m;k++)gr+=am*Math.pow(1+g,(m-k)/12);const inv=cur+am*m;return Math.max(0,p.k=='C'?inv+(gr-inv)*(1-irC(m*30)):gr)})}});
const mk=s=>s.length>1?[...s,{label:'Total',data:s[0].data.map((_,i)=>sum(s.map(q=>q.data[i]))),tot:1}]:s,cur=sum(hist.map(h=>h.data[h.data.length-1])),inv=sum(ps.map(p=>sum(p.movs.map(m=>m.v)))),mo=Math.max(1,dd(start,T)/30.4);
return{ds,hist:mk(hist),pl,proj:mk(proj),cur,inv,rend:cur-inv,mes:(cur-inv)/mo,end:sum(proj.map(s=>s.data[N]))}}
function pfCharts(){const d=pfData();if(!d)return;const mk=(s,l)=>({labels:l.map(fdd),datasets:s.map((q,i)=>({label:q.label,data:q.data,borderColor:q.tot?'#0B2239':PAL[i%8],backgroundColor:q.tot?'#0B2239':PAL[i%8],borderWidth:q.tot?3:2,pointRadius:0,pointHoverRadius:5}))});ch('pf1','line',mk(d.hist,d.ds));ch('pf2','line',mk(d.proj,d.pl))}
function pPf(){pfCharts()}
function vPf(){const d=pfData(),kp=d?`<div class='g'><div class='card'><h4>Investido (aportes − retiradas)</h4><div class='big'>${brl(d.inv)}</div></div><div class='card'><h4>Valor atual</h4><div class='big'>${brl(d.cur)}</div></div><div class='card'><h4>Rendimento líquido</h4><div class='big ${d.rend>=0?'pos':'neg'}'>${brl(d.rend)}</div></div><div class='card'><h4>Rendimento por mês</h4><div class='big ${d.mes>=0?'pos':'neg'}'>${brl(d.mes)}</div><div style='color:var(--mut);font-size:12px'>Média desde o 1º aporte</div></div><div class='card'><h4>Projeção em ${S.pfN||12} meses</h4><div class='big'>${brl(d.end)}</div></div></div>`:'';
return `<div class='fl'><button class='b1' onclick='pfNew()'>+ Novo investimento</button><button onclick='pfMov(1)'>+ Aporte</button><button onclick='pfMov(-1)'>− Retirada</button><label style='max-width:180px'>Projeção (meses)<input type='number' min='1' value='${S.pfN||12}' onchange='S.pfN=+this.value||12;touch();render()'></label></div>${kp||`<div class='card em'>Nenhum investimento ainda. Clique em + Novo investimento</div>`}<div class='g'>${cv('pf1','Valor atual')}${cv('pf2','Projeção futura (sem novos aportes)')}</div><div class='card'><h4>Investimentos e movimentações</h4>${S.pf.map((p,i)=>`<div style='margin-bottom:10px'><div class='row'><b>${pfLbl(p)}${p.k=='C'?' · '+(p.pct??((S.cdb.find(c=>c.b==p.ref)||{}).pct??'—'))+'% CDI':''}</b><button class='bd' onclick='pfDel(${i})'>Excluir</button></div>${p.movs.map((m,j)=>`<div class='row' style='font-size:12px'><span>${fdd(m.d)} · ${m.v>=0?'Aporte':'Retirada'}</span><span class='${m.v>=0?'pos':'neg'}'>${brl(Math.abs(m.v))}</span><button onclick='pfDelM(${i},${j})'>✕</button></div>`).join('')}</div>`).join('')||`<div class='em'>—</div>`}</div>`}
function pfNew(){const o=[...S.a.map(a=>['A:'+a.t,'Ação · '+a.t]),...S.cdb.map(c=>['C:'+c.b,'CDB · '+c.b+(c.pct?' ('+c.pct+'% CDI)':'')])];modal('Novo investimento',[{k:'ref',l:'Tipo de investimento',type:'select',opts:o},{k:'pct',l:'% do CDI (só CDB; vazio = tabela)',type:'number'},{k:'v',l:'Valor investido (R$)',type:'number'},{k:'d',l:'Data',type:'date',v:td()}],v=>{if(!(v.v>0)||!v.d)return toast('Informe valor e data','erro'),false;const[k,...r]=v.ref.split(':');S.pf.push({id:Date.now(),k,ref:r.join(':'),pct:isNaN(v.pct)?null:v.pct,movs:[{d:v.d,v:v.v}]});touch();toast('Investimento adicionado');render()})}
function pfMov(s){if(!S.pf.length)return toast('Crie um investimento primeiro','aviso');modal(s>0?'Novo aporte':'Nova retirada',[{k:'i',l:'Investimento',type:'select',opts:S.pf.map((p,i)=>[i,pfLbl(p)])},{k:'v',l:'Valor (R$)',type:'number'},{k:'d',l:'Data',type:'date',v:td()}],v=>{if(!(v.v>0)||!v.d)return toast('Informe valor e data','erro'),false;S.pf[+v.i].movs.push({d:v.d,v:s*v.v});touch();toast(s>0?'Aporte registrado':'Retirada registrada');render()})}
function pfDel(i){if(confirm('Excluir este investimento?')){S.pf.splice(i,1);touch();render()}}
function pfDelM(i,j){S.pf[i].movs.splice(j,1);if(!S.pf[i].movs.length)S.pf.splice(i,1);touch();render()}
function applyTh(){document.documentElement.dataset.theme=S.dk?'dark':'light';Chart.defaults.color=S.dk?'#94A3B8':'#666';Chart.defaults.borderColor=S.dk?'#334155':'#e3e9f0'}
function sair(){window.fbSair&&window.fbSair()}
function setTh(){S.dk=!S.dk;try{localStorage.setItem('financas_tema',S.dk?'1':'0')}catch(e){}applyTh();render()}
applyTh();
function openS(i){const s=S.sim[i];sm={nome:s.nome,modo:s.modo,data:s.data,meses:s.meses,rows:JSON.parse(JSON.stringify(s.rows)),run:1};render()}
render();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* =====================================================================
   1) COLE AQUI AS CHAVES DO SEU PROJETO FIREBASE
   Firebase Console > Configurações do projeto (engrenagem) > Geral >
   "Seus aplicativos" > app Web (</>) > "Configuração do SDK" > copie os valores.
   Substitua cada "COLE_AQUI" pelo valor correspondente.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "COLE_AQUI",
  authDomain: "COLE_AQUI",
  projectId: "COLE_AQUI",
  storageBucket: "COLE_AQUI",
  messagingSenderId: "COLE_AQUI",
  appId: "COLE_AQUI"
};
/* =====================================================================
   2) CÓDIGO DE ACESSO (sem login)
   Todos os seus aparelhos que abrirem este arquivo com o MESMO código
   veem os mesmos dados. Quem souber o código acessa seus dados: mantenha
   o endereço do site privado e, se quiser, troque o código por outro
   texto longo e aleatório (trocar o código começa uma base de dados nova).
   ===================================================================== */
const CODIGO_DE_ACESSO = "06289b7060311a3b812226b79f6c35e1";
/* ===================================================================== */

// Cada item (lançamento, meta, orçamento, investimento) vira 1 documento em usuarios/{código}/registros.
// O restante (categorias, ações, CDBs, simulações...) fica no documento "config".
const ITENS=['l','m','o','pf'],CFG=['c','p','a','sim','simc','cdb','cdi','fx','pfN','qv'];
let pronto=false,last={};
const erro=e=>toast('Falha ao sincronizar: '+(e.code||e.message),'erro'),nuvem=t=>{window.nuvem=t;head()};
if(firebaseConfig.apiKey==='COLE_AQUI'){toast('Cole suas chaves do Firebase no bloco firebaseConfig para salvar na nuvem','aviso');nuvem('Somente neste aparelho')}
else try{
  const db=getFirestore(initializeApp(firebaseConfig)),col=collection(db,'usuarios',CODIGO_DE_ACESSO,'registros'),base=JSON.parse(JSON.stringify(S));
  // Envia só o que mudou (setDoc) e apaga o que foi removido (deleteDoc)
  window.syncSave=()=>{if(!pronto)return false;const quer={};
    ITENS.forEach(k=>(S[k]||[]).forEach(it=>quer[k+'_'+it.id]=JSON.stringify(it)));
    const cfg={};CFG.forEach(k=>{if(S[k]!==undefined)cfg[k]=S[k]});quer.config=JSON.stringify(cfg);
    for(const [id,v] of Object.entries(quer))if(last[id]!==v){last[id]=v;setDoc(doc(col,id),{v,atualizado:Date.now()}).catch(erro)}
    for(const id of Object.keys(last))if(!(id in quer)){delete last[id];deleteDoc(doc(col,id)).catch(erro)}
    return true};
  // Tempo real: mudanças feitas em outro aparelho chegam aqui sem F5
  onSnapshot(col,snap=>{
    if(snap.metadata.hasPendingWrites&&pronto)return;
    const d={};snap.forEach(x=>d[x.id]=x.data().v);
    const primeira=!pronto,dk=S.dk;
    if(primeira){S=JSON.parse(JSON.stringify(base));S.dk=dk} // dados deste aparelho (se existirem) sobem para a nuvem quando ela está vazia
    const antes=JSON.stringify(S),arr={l:[],m:[],o:[],pf:[]};let cfg=null;
    Object.entries(d).forEach(([id,v])=>{const o=JSON.parse(v);if(id=='config')cfg=o;else{const k=id.split('_')[0];arr[k]&&arr[k].push(o)}});
    if(snap.size){ITENS.forEach(k=>arr[k].sort((a,b)=>a.id-b.id));Object.assign(S,arr);if(cfg)Object.assign(S,cfg)}
    last={...d};pronto=true;nuvem('Sincronizado');
    if(primeira){applyTh();render();if(!snap.size)window.syncSave()}
    else if(JSON.stringify(S)!=antes)render();
  },e=>{nuvem('Erro de conexão');toast('Erro ao carregar dados: '+(e.code||e.message),'erro')});
}catch(e){nuvem('Somente neste aparelho');toast('Firebase não iniciou: '+(e.code||e.message),'erro')}
</script>
